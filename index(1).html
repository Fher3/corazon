<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Monchis</title>
<style>
  :root {
    --bg: #060208;
    --paper: #f6e9df;
    --ink: #4a1020;
    --wine: #8f0a22;
    --rose: #e5233a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg);
    overflow: hidden; font-family: Georgia, "Times New Roman", serif;
  }
  canvas#heart {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  }

  /* ---------- Carta ---------- */
  #letter-screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #2a0612 0%, var(--bg) 70%);
    padding: 24px;
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  #letter-screen.gone { opacity: 0; visibility: hidden; pointer-events: none; }

  .letter {
    position: relative;
    width: min(420px, 100%);
    padding: 56px 36px 44px;
    background: var(--paper);
    color: var(--ink);
    text-align: center;
    border-radius: 4px;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(143,10,34,.25) inset;
    transition: transform .9s ease, opacity .9s ease;
  }
  #letter-screen.gone .letter { transform: translateY(-40px) scale(.96); opacity: 0; }

  .letter::before {            /* línea doble tipo papel de carta */
    content: ""; position: absolute; inset: 12px;
    border: 1px solid rgba(143,10,34,.35); pointer-events: none;
  }
  .seal {
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff5a6c, var(--wine) 70%);
    display: grid; place-items: center; color: #ffd9de; font-size: 24px;
    box-shadow: 0 6px 14px rgba(0,0,0,.45);
  }
  .letter h1 {
    margin: 0 0 14px; font-size: clamp(34px, 9vw, 46px);
    font-weight: normal; font-style: italic; letter-spacing: .01em;
    color: var(--wine);
  }
  .letter p { margin: 0 0 30px; font-size: 17px; line-height: 1.55; }

  button#open {
    appearance: none; border: 0; cursor: pointer;
    padding: 14px 30px; border-radius: 999px;
    font: inherit; font-size: 17px; color: #fff;
    background: linear-gradient(180deg, #ee2f45, var(--wine));
    box-shadow: 0 8px 20px rgba(143,10,34,.45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button#open:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(143,10,34,.55); }
  button#open:active { transform: translateY(0); }
  button#open:focus-visible { outline: 3px solid #ffd9de; outline-offset: 3px; }

  /* ---------- Botón de música ---------- */
  #mute {
    position: fixed; right: max(14px, env(safe-area-inset-right));
    top: max(14px, env(safe-area-inset-top)); z-index: 5;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.06); color: #fff; font-size: 18px;
    cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 1s ease 1s;
  }
  body.started #mute { opacity: .8; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    #letter-screen, .letter { transition-duration: .01s; }
  }
</style>
</head>
<body>

<canvas id="heart"></canvas>

<button id="mute" aria-label="Silenciar música" title="Música">♪</button>

<div id="letter-screen">
  <div class="letter">
    <div class="seal">♥</div>
    <h1>Para Monchis</h1>
    <p>Tengo algo que decirte,<br>en muchos idiomas.</p>
    <button id="open">Abrir carta</button>
  </div>
</div>

<!-- Pon aquí el nombre exacto de tu archivo de música -->
<audio id="song" src="love.mp3" loop preload="auto"></audio>

<script>
/* ===================== CONFIGURACIÓN ===================== */
const DURATION = 10;        // segundos que tarda en llenarse el corazón
const ANIM_MS  = 672;       // duración de la aparición de cada frase
const SIZES    = [9, 10, 11, 12];
const GAP      = 7;
const FONT     = 'Arial, "Noto Sans", sans-serif';
const BG       = "#060208";

const PHRASES = [
  "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
  "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
  "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
  "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
  "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю",
];

/* ===================== UTILIDADES ===================== */
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

function mulberry32(a) {                       // aleatorio con semilla (siempre igual)
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = v => Math.max(0, Math.min(1, v));
const mix   = (a, b, k) => a.map((p, i) => p + (b[i] - p) * k);
const dim   = (c, k) => c.map(v => v * k);
const hx    = c => "#" + c.map(v => Math.round(clamp(v) * 255).toString(16).padStart(2, "0")).join("");
const BGC   = [1, 3, 5].map(i => parseInt(BG.slice(i, i + 2), 16) / 255);
const FLASH = [1.0, 0.78, 0.78];

/* ===================== ESTADO ===================== */
let W = 0, H = 0, K = 1, SC = 21, OY = 0;
let items = [];
let startTime = null;        // se define al hacer clic
let lastShimmer = 0;

/* ===================== GEOMETRÍA DEL CORAZÓN ===================== */
function heartPt(a) {
  const x = 16 * Math.pow(Math.sin(a), 3);
  const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
  return [x * SC, y * SC + OY];
}

function build() {
  const rng = mulberry32(11);
  const POLY = Array.from({ length: 720 }, (_, i) => heartPt(2 * Math.PI * i / 720));
  const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
  const YMAX = Math.max(...POLY.map(p => p[1]));
  const YMIN = Math.min(...POLY.map(p => p[1]));
  const CY = (YMAX + YMIN) / 2;

  const spans = y => {
    const xs = [];
    for (const [[x1, y1], [x2, y2]] of EDGES) {
      if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
        xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
      }
    }
    xs.sort((a, b) => a - b);
    const out = [];
    for (let i = 0; i + 1 < xs.length; i += 2) out.push([xs[i], xs[i + 1]]);
    return out;
  };
  const intersect = (A, B) => {
    const out = [];
    for (const a of A) for (const b of B) {
      const lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
      if (hi - lo > 14 * K) out.push([lo, hi]);
    }
    return out;
  };

  // ciclo de frases mezcladas
  let queue = [];
  const nextPhrase = () => {
    if (!queue.length) {
      queue = PHRASES.slice();
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
    }
    return queue.pop();
  };

  const fs = Math.max(0.8, K);                    // escala de fuente (mínimo legible)
  const sizes = SIZES.map(s => s * fs);
  const measure = (text, size) => {
    ctx.font = `bold ${size}px ${FONT}`;
    return ctx.measureText(text).width;
  };

  const rowH = Math.max(...sizes) * 1.2 + 4 * fs;
  const half = rowH / 2;
  const gap = GAP * fs;
  const placed = [];

  let y = YMAX - half;
  while (y > YMIN + half) {
    const row = intersect(spans(y + half), spans(y - half));
    for (let [lo, hi] of row) {
      lo += 4 * fs; hi -= 4 * fs;
      let cur = lo + rng() * 8;
      const line = [];
      while (true) {
        let fit = null;
        for (let t = 0; t < 10; t++) {
          const text = nextPhrase();
          const size = sizes[Math.floor(rng() * sizes.length)];
          const w = measure(text, size);
          if (cur + w <= hi) { fit = { text, size, w }; break; }
        }
        if (!fit) break;
        line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
        cur += fit.w + gap;
      }
      if (!line.length) continue;

      if (line.length > 1) {
        const last = line[line.length - 1];
        const left = hi - (last.x + last.w / 2);
        line.forEach((it, i) => { it.x += left * i / (line.length - 1); });
      } else {
        line[0].x = (lo + hi) / 2;
      }
      line.forEach((it, i) => {
        placed.push({ x: it.x, y, text: it.text, size: it.size,
                      edge: i === 0 || i === line.length - 1 });
      });
    }
    y -= rowH;
  }

  // colores
  const wine = [0.58, 0.0, 0.09], crimson = [0.90, 0.05, 0.14], blood = [0.98, 0.10, 0.16];
  for (const p of placed) {
    const rad = Math.min(1, Math.hypot(p.x / (16 * SC), (p.y - CY) / (14.5 * SC)));
    let base = mix(wine, crimson, 0.25 + 0.75 * rad);
    base = mix(base, blood, rng() * 0.35 + (p.edge ? 0.3 : 0));
    p.color = base.map(v => Math.min(1, v));
    p.rad = rad;
    p.dx = (rng() * 2 - 1) * 10 * K;
  }

  // orden de aparición: primero el contorno, luego el relleno de afuera hacia adentro
  const edges = placed.filter(p => p.edge);
  const inner = placed.filter(p => !p.edge);
  edges.sort((a, b) =>
    ((Math.atan2(a.x, a.y - CY) + 2 * Math.PI) % (2 * Math.PI)) -
    ((Math.atan2(b.x, b.y - CY) + 2 * Math.PI) % (2 * Math.PI)));
  inner.sort((a, b) => (-a.rad + rng() * 0.08) - (-b.rad + rng() * 0.08));
  const order = edges.concat(inner);

  const interval = (DURATION * 1000) / order.length;
  order.forEach((p, i) => { p.start = i * interval; p.shimmer = 0; });
  p_CY = CY;
  return order;
}
let p_CY = 0;

/* ===================== TAMAÑO / RESIZE ===================== */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  SC = Math.min(W * 0.94 / 32, H * 0.84 / 29.5);
  K = SC / 21;
  OY = 20 * K;
  items = build();
}

/* ===================== DIBUJO ===================== */
function frame(now) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  if (startTime !== null) {
    const el = now - startTime;
    const fs = Math.max(0.8, K);
    const LIFT = 34 * K;
    const ox = W / 2;
    const oy = H / 2 + p_CY;                        // y_pantalla = oy - y_matemática

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let finished = true;
    for (const p of items) {
      const t = el - p.start;
      if (t < 0) { finished = false; continue; }
      const u = clamp(t / ANIM_MS);
      if (u < 1) finished = false;
      const e = 1 - Math.pow(1 - u, 3);
      const c = p.color;

      const x = ox + p.x, y = oy - p.y;
      const px = x + p.dx * (1 - e);
      const py = y - (1 - e) * LIFT;

      // sombra
      ctx.font = `bold ${p.size}px ${FONT}`;
      ctx.fillStyle = hx(mix(BGC, dim(c, 0.30), e));
      ctx.fillText(p.text, x + 2 * fs, y + 3 * fs);

      // halo
      ctx.font = `bold ${p.size + 1}px ${FONT}`;
      ctx.fillStyle = hx(mix(BGC, dim(c, 0.20), e * e));
      ctx.fillText(p.text, u >= 1 ? x : px, u >= 1 ? y : py);

      // texto principal
      let col;
      if (u < 1) {
        const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
        col = mix(mix(BGC, c, Math.pow(e, 1.5)), FLASH, flash);
      } else {
        col = c;
        if (p.shimmer > now) {
          const k = (p.shimmer - now) / 260;
          col = mix(c, FLASH, 0.6 * clamp(k));
        }
      }
      ctx.font = `bold ${p.size}px ${FONT}`;
      ctx.fillStyle = hx(col);
      ctx.fillText(p.text, u >= 1 ? x : px, u >= 1 ? y : py);
    }

    // destellos aleatorios cuando ya terminó
    if (finished && now - lastShimmer > 140) {
      lastShimmer = now;
      const p = items[Math.floor(Math.random() * items.length)];
      p.shimmer = now + 260;
    }
  }
  requestAnimationFrame(frame);
}

/* ===================== INTERACCIÓN ===================== */
const song = document.getElementById("song");
const screen = document.getElementById("letter-screen");
const openBtn = document.getElementById("open");
const muteBtn = document.getElementById("mute");

openBtn.addEventListener("click", () => {
  song.volume = 0.9;
  song.play().catch(() => { /* si el navegador la bloquea, el botón ♪ la activa */ });
  screen.classList.add("gone");
  document.body.classList.add("started");
  setTimeout(() => { startTime = performance.now(); }, 700);   // empieza tras desvanecer la carta
});

muteBtn.addEventListener("click", () => {
  if (song.paused) { song.play(); muteBtn.textContent = "♪"; muteBtn.style.opacity = .8; }
  else { song.pause(); muteBtn.textContent = "✕"; muteBtn.style.opacity = .5; }
});

let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 150); });

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
